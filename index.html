<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Midnight Broomstick Ride</title>

    <link rel="stylesheet" href="haunted-harvest.css">
</head>

<body>

    <header>
        <h1>Midnight Broomstick Ride</h1>
        <p>A spooky night through the Halloween sky...</p>
    </header>


    <!-- Main animation -->
    <main class="scene">

        <!-- Moon -->
        <div class="moon"></div>

        <!-- Clouds -->
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>

        <!-- Flying owl -->
        <div class="owl">🦉</div>

        <!-- Witch -->
        <div class="witch">
            <img src="assets/images/witch.png" alt="Witch riding a broomstick">

            <!-- Broomstick sparks -->
            <span class="spark spark-one">✦</span>
            <span class="spark spark-two">✧</span>
            <span class="spark spark-three">✦</span>
        </div>


        <!-- Trees -->
        <div class="trees">
            <span>🌲</span>
            <span>🌲</span>
            <span>🌲</span>
            <span>🌲</span>
        </div>


        <!-- Ground -->
        <div class="ground">

            <div class="grave">RIP</div>

            <div class="pumpkin">🎃</div>

            <div class="cat">🐈‍⬛</div>

        </div>

    </main>


    <footer>
        🎃 Happy Halloween! 👻
    </footer>

</body>

</html>
